; Adjust directory/command paths to the real deployment directory before installing.
[program:server-monitor]
directory=/www/wwwroot/game_crawl
command=/www/wwwroot/game_crawl/venv/bin/python -u -m tools.server_monitor
environment=APP_ENV="prod"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/www/wwwroot/game_crawl/logs/server_monitor.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
